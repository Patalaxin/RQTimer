name: Deploy

on:
  push:
    branches:
      - master

jobs:
  # Отдельным job, а не шагом в deploy: бэкенду нужен Node 20+ (@nestjs/core,
  # prisma, resend), а фронт ниже собирается на 18. Базы тестам не нужно —
  # PrismaService в них подменён, окружение приходит через configProvider.
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      # Клиент Prisma нужен и тестам: спеки ссылаются на типы @prisma/client.
      # DATABASE_URL для генерации не требуется — строка подключения живёт не в
      # схеме, а в коде (PrismaPg).
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run backend tests
        working-directory: backend
        run: npm test -- --ci

  deploy:
    runs-on: ubuntu-latest
    # Красные тесты не должны доезжать до сервера.
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # FRONTEND BUILD
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ARCHIVE FRONTEND
      - name: Archive frontend
        run: |
          tar -czf frontend.tar.gz -C frontend/dist/rq-timer-fe .

      # COPY ARCHIVE TO SERVER
      - name: Copy frontend archive
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          password: ${{ secrets.SSH_PASS }}
          source: "frontend.tar.gz"
          target: "/root"

      # DEPLOY
      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          password: ${{ secrets.SSH_PASS }}
          script: |
            set -ex

            cd ~/TimerRQ
            git pull

            # backend
            cd backend

            if [ -f .env ]; then rm .env; fi

            echo "SECRET_CONSTANT=${{ secrets.SECRET_CONSTANT }}" >> .env
            echo "UNIXTIME_KEY=${{ secrets.UNIXTIME_KEY }}" >> .env
            echo "OTP_USER=${{ secrets.OTP_USER }}" >> .env
            echo "OTP_PASS=${{ secrets.OTP_PASS }}" >> .env
            echo "DATABASE_USER=${{ secrets.DATABASE_USER }}" >> .env
            echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> .env
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env 
            echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env
            echo "OTP_FROM=${{ secrets.OTP_FROM }}" >> .env
            echo "IP_DB=${{ secrets.IP_DB }}" >> .env

            # Ниже — обязательные по src/config/env.validation.ts. Без любой из
            # них приложение падает на старте, ещё до app.listen. Секретное
            # здесь только DATABASE_URL: в нём пароль от Postgres.
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
            echo "CORS_ORIGIN=https://www.rqtimer.ru" >> .env
            echo "SWAGGER_SERVER_URL=https://www.rqtimer.ru/api" >> .env
            echo "PORT=3000" >> .env

            # Приложение эти три не читает — их подставляет docker-compose.yml
            # при создании контейнера Postgres. Значения обязаны совпадать с
            # тем, что внутри DATABASE_URL, иначе migrate deploy не пройдёт
            # аутентификацию. Пишутся здесь, потому что .env выше удаляется и
            # пересоздаётся на каждом деплое.
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env

            npm ci

            # npm ci сносит node_modules, а postinstall-хука, который поднимал
            # бы клиент Prisma, в проекте нет — генерируем явно.
            npx prisma generate

            npm run build

            # Базы описаны в docker-compose.yml, но до этого их не поднимал
            # никто: на чистой машине деплой падал на migrate deploy, потому
            # что Postgres просто не существовал. Команда идемпотентная —
            # работающие контейнеры не трогает, пересоздаёт только те, чьё
            # описание в compose изменилось. Данные лежат в именованных томах
            # и пересоздание переживают.
            #
            # Сервисы перечислены поимённо, а не через голый `up -d`: в compose
            # есть ещё mongo-express — админка на 8081, открытая наружу. Её
            # запуск должен оставаться осознанным действием, а не побочным
            # эффектом деплоя.
            docker compose up -d postgres mongo

            # Первый запуск Postgres — это initdb: порт уже проброшен, а сервер
            # ещё не отвечает. Без ожидания migrate deploy стучится в пустоту и
            # роняет весь деплой. pg_isready возвращает успех и на отказе в
            # доступе — нам здесь важно только то, что постмастер отвечает.
            for _ in $(seq 1 60); do
              if docker compose exec -T postgres pg_isready -q; then break; fi
              sleep 1
            done

            # Схема БД доезжает до рестарта, а не после него: иначе новый код
            # успевает встать на старую таблицу. deploy не задаёт вопросов и
            # не пересоздаёт базу, в отличие от migrate dev.
            npx prisma migrate deploy

            pm2 restart main
            pm2 save

            # frontend
            sudo mkdir -p /var/www/rqtimer_new
            sudo rm -rf /var/www/rqtimer_new/*

            sudo tar -xzf /root/frontend.tar.gz -C /var/www/rqtimer_new

            sudo rm -rf /var/www/rqtimer_backup
            sudo mv /var/www/rqtimer /var/www/rqtimer_backup || true
            sudo mv /var/www/rqtimer_new /var/www/rqtimer

            sudo service nginx reload