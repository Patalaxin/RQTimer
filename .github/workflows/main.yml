name: Test Frontend Build

on:
  push:
    branches:
      - master

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular app
        working-directory: frontend
        run: npm run build

      - name: Verify build output
        working-directory: frontend
        run: |
          set -ex

          echo "Current directory:"
          pwd

          echo "Dist contents:"
          find dist -maxdepth 3 -type f | head -50

          test -f dist/rq-timer-fe/index.html

      - name: Archive frontend build
        run: |
          tar -czf frontend-dist.tar.gz -C frontend/dist/rq-timer-fe .

      - name: Verify archive
        run: |
          ls -lh frontend-dist.tar.gz
          tar -tzf frontend-dist.tar.gz | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist.tar.gz
          retention-days: 7