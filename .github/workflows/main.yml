name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # FRONTEND BUILD
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ARCHIVE FRONTEND
      - name: Archive frontend
        run: |
          tar -czf frontend.tar.gz -C frontend/dist/rq-timer-fe .

      # COPY ARCHIVE TO SERVER
      - name: Copy frontend archive
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          password: ${{ secrets.SSH_PASS }}
          source: "frontend.tar.gz"
          target: "/root"

      # DEPLOY
      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          password: ${{ secrets.SSH_PASS }}
          script: |
            set -ex

            cd ~/TimerRQ
            git pull

            # backend
            cd backend

            if [ -f .env ]; then rm .env; fi

            echo "SECRET_CONSTANT=${{ secrets.SECRET_CONSTANT }}" >> .env
            echo "UNIXTIME_KEY=${{ secrets.UNIXTIME_KEY }}" >> .env
            echo "OTP_USER=${{ secrets.OTP_USER }}" >> .env
            echo "OTP_PASS=${{ secrets.OTP_PASS }}" >> .env
            echo "DATABASE_USER=${{ secrets.DATABASE_USER }}" >> .env
            echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> .env
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env 
            echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env
            echo "OTP_FROM=${{ secrets.OTP_FROM }}" >> .env
            echo "IP_DB=${{ secrets.IP_DB }}" >> .env

            # Ниже — обязательные по src/config/env.validation.ts. Без любой из
            # них приложение падает на старте, ещё до app.listen. Секретное
            # здесь только DATABASE_URL: в нём пароль от Postgres.
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
            echo "CORS_ORIGIN=https://www.rqtimer.ru" >> .env
            echo "SWAGGER_SERVER_URL=https://www.rqtimer.ru/api" >> .env
            echo "PORT=3000" >> .env

            npm ci

            # npm ci сносит node_modules, а postinstall-хука, который поднимал
            # бы клиент Prisma, в проекте нет — генерируем явно.
            npx prisma generate

            npm run build

            # Схема БД доезжает до рестарта, а не после него: иначе новый код
            # успевает встать на старую таблицу. deploy не задаёт вопросов и
            # не пересоздаёт базу, в отличие от migrate dev.
            npx prisma migrate deploy

            pm2 restart main
            pm2 save

            # frontend
            sudo mkdir -p /var/www/rqtimer_new
            sudo rm -rf /var/www/rqtimer_new/*

            sudo tar -xzf /root/frontend.tar.gz -C /var/www/rqtimer_new

            sudo rm -rf /var/www/rqtimer_backup
            sudo mv /var/www/rqtimer /var/www/rqtimer_backup || true
            sudo mv /var/www/rqtimer_new /var/www/rqtimer

            sudo service nginx reload