@if (isLoading | async) {
  <nz-skeleton [nzActive]="true" class="container"></nz-skeleton>
}

@if (!(isLoading | async)) {
  <div class="history container">
    <nz-page-header class="site-page-header" nzBackIcon (nzBack)="onTimer()">
      <nz-page-header-title (click)="onBack($event)" style="cursor: pointer">{{
        "HISTORY.HEADER_TITLE" | translate
      }}</nz-page-header-title>
      <nz-page-header-extra>
        <app-info [user]="user"></app-info>
      </nz-page-header-extra>
    </nz-page-header>
    <app-log
      [historyList]="historyList"
      [historyListData]="historyListData"
      [mobId]="''"
    ></app-log>
  </div>
}
